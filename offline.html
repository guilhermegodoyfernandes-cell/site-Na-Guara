<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="theme-color" content="#f8b93f">

<body class="offline-page">
  <main class="offline-page__main">
    <a class="brand offline-page__brand" href="./">

          <circle cx="47.5" cy="15.5" r="5" fill="#d95332"/>
        </svg>
      </span>
      <span class="brand__text"><strong>Na'Guara</strong><small>Comida venezolana</small></span>
      <span class="sr-only">— voltar ao início</span>
    </a>
    <div class="offline-page__art" aria-hidden="true">
      <svg viewBox="0 0 190 155">
        <circle cx="95" cy="77" r="60" fill="#fbe8b8"/>
        <circle cx="95" cy="77" r="44" fill="#f8b93f"/>

    <p class="eyebrow offline-page__eyebrow"><span class="eyebrow__dot" aria-hidden="true"></span>Sem conexão</p>

    <p class="offline-page__text">Você está offline, mas o cardápio da Na'Guara já está salvo no seu dispositivo. Para enviar o pedido pelo WhatsApp, reconecte-se à internet.</p>
    <div class="offline-page__actions">
      <button class="btn btn--primary btn--lg" type="button" onclick="window.location.reload()">Tentar novamente</button>
      <a class="btn btn--soft btn--lg" href="./">Voltar ao início</a>
    </div>
    <p class="offline-page__foot">Na'Guara · tequeños e arepas feitos com amor</p>
